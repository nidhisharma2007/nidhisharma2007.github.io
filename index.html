    <!-- Intro guard: hides the page until the creature intro is ready (plays once per tab session; add ?intro to replay) -->
    <script>
      (function () {
        try {
          var d = document.documentElement;
          var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
          var seen = sessionStorage.getItem("nc-intro");
          if (!reduce && (!seen || /[?&]intro\b/.test(location.search))) {
            d.classList.add("fx-intro");
            setTimeout(function () { d.classList.remove("fx-intro"); }, 12000); // failsafe
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preload" as="image" href="./assets/creature.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Fonts: non-blocking, so the page shows immediately with fallback fonts -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&family=Syne:wght@600;700;800&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>

    </noscript>
